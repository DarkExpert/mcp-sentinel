name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --no-restore
      - name: Public demo
        shell: pwsh
        run: ./scripts/run-demo.ps1 -SkipBuild
      - name: Demo failure cleanup
        shell: pwsh
        run: |
          $output = & pwsh -NoProfile -File ./scripts/run-demo.ps1 -SkipBuild -PolicyPath ./policies/missing-policy.json 2>&1
          if ($LASTEXITCODE -ne 1 -or ($output -join "`n") -notmatch 'Cleanup verified: 2 owned child processes exited') {
            throw 'Expected failed startup and verified owned-process cleanup.'
          }
          exit 0
